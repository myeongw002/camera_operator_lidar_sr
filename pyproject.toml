[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-operator-lidar-sr"
version = "0.1.0"
description = "Camera-guided local-operator LiDAR super-resolution"
requires-python = ">=3.10"
dependencies = ["numpy", "torch", "PyYAML"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
